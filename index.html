<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a3f">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<title>JJ Lawn Sales</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#17301f}
header{background:#1f7a3f;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:1000}
header h1{margin:0;font-size:21px}header p{margin:3px 0 0;font-size:12px;opacity:.9}
#map{height:56vh;min-height:390px}
.panel{background:#fff;padding:14px 16px;border-radius:18px 18px 0 0;box-shadow:0 -3px 15px #0002;position:relative;z-index:900}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#1f7a3f;color:#fff;font-size:14px}
button.secondary{background:#e6eee8;color:#174d2a}button.yes{background:#238b45}button.no{background:#b73535}
input,select{padding:11px;border:1px solid #cbd8ce;border-radius:10px;font-size:15px;width:100%}
.field{flex:1;min-width:120px}.small{font-size:12px;color:#5d6c61}.price{font-size:28px;font-weight:800;color:#1f7a3f}
.card{background:#f7faf7;border:1px solid #dce7de;border-radius:14px;padding:12px;margin-top:10px}
.hidden{display:none}.status{font-weight:800}.list{max-height:230px;overflow:auto}
.leaflet-popup-content{font-size:14px}.building{cursor:pointer}
</style>
</head>
<body>
<header><h1>🌱 JJ Lawn Sales</h1><p>Door-knocking • property measuring • instant quotes</p></header>
<div id="map"></div>
<section class="panel">
  <div class="row">
    <button onclick="locate()">📍 Find Me</button>
    <button class="secondary" onclick="loadBuildings()">🏠 Load Houses</button>
    <button class="secondary" onclick="startMeasure()">📐 Measure Yard</button>
  </div>

  <div id="selected" class="card hidden">
    <div class="small">Selected property</div>
    <div id="address" style="font-weight:800;margin:3px 0 8px">Tap a house on the map</div>
    <div class="row">
      <div class="field"><label class="small">Yard sq ft</label><input id="sqft" type="number" min="0" placeholder="e.g. 6500" oninput="calcPrice()"></div>
      <div class="field"><label class="small">Acres</label><input id="acres" type="number" min="0" step="0.001" placeholder="e.g. 0.25" oninput="fromAcres()"></div>
    </div>
    <div style="margin-top:10px" class="small">Quote</div>
    <div id="price" class="price">$0</div>
    <div class="small">Base + area pricing. Change your rates in Settings.</div>
    <div class="row" style="margin-top:10px">
      <button class="yes" onclick="saveLead('YES')">✓ Customer Said YES</button>
      <button class="no" onclick="saveLead('NO')">✕ Customer Said NO</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>Saved Customers</b><button class="secondary" onclick="showSettings()">⚙️ Settings</button>
    </div>
    <div id="leads" class="list"></div>
  </div>

  <div id="settings" class="card hidden">
    <b>Pricing</b>
    <div class="row" style="margin-top:8px">
      <div class="field"><label class="small">Base price ($)</label><input id="base" type="number" value="35"></div>
      <div class="field"><label class="small">Price per 1,000 sq ft ($)</label><input id="per1000" type="number" value="12"></div>
    </div>
    <button style="margin-top:9px" onclick="saveSettings()">Save Pricing</button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
const map=L.map('map').setView([42.94,-85.86],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
let selected=null, drawing=null, buildings=L.layerGroup().addTo(map);
let leads=JSON.parse(localStorage.getItem('jjLeads')||'[]');
let settings=JSON.parse(localStorage.getItem('jjSettings')||'{"base":35,"per1000":12}');
document.getElementById('base').value=settings.base;document.getElementById('per1000').value=settings.per1000;
renderLeads();

function locate(){
 navigator.geolocation.getCurrentPosition(p=>{
   const ll=[p.coords.latitude,p.coords.longitude]; map.setView(ll,18);
   L.circleMarker(ll,{radius:9,color:'#1f7a3f',fillOpacity:.8}).addTo(map).bindPopup('You are here').openPopup();
   loadBuildings();
 },()=>alert('Location permission was not allowed. Turn on Location for your browser.'));
}
async function loadBuildings(){
 const c=map.getCenter(), d=.008;
 const q=`[out:json][timeout:20];way["building"](${c.lat-d},${c.lng-d},${c.lat+d},${c.lng+d});out geom;`;
 try{
  const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
  const data=await r.json(); buildings.clearLayers();
  data.elements.forEach(el=>{
   if(!el.geometry||el.geometry.length<3)return;
   const pts=el.geometry.map(x=>[x.lat,x.lon]);
   const poly=L.polygon(pts,{color:'#1f7a3f',weight:1,fillOpacity:.18});
   poly.on('click',()=>selectProperty(poly.getBounds().getCenter(),el));
   poly.addTo(buildings);
  });
 }catch(e){alert('Could not load house footprints right now. You can still tap the map and measure a yard.');}
}
async function selectProperty(ll,el){
 selected={lat:ll.lat,lng:ll.lng,buildingId:el.id};
 document.getElementById('selected').classList.remove('hidden');
 document.getElementById('address').textContent='Property near '+ll.lat.toFixed(5)+', '+ll.lng.toFixed(5);
 document.getElementById('sqft').value='';document.getElementById('acres').value='';calcPrice();
 try{
  const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${ll.lat}&lon=${ll.lng}`;
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  const j=await r.json(); if(j.display_name)document.getElementById('address').textContent=j.display_name;
 }catch(e){}
 map.setView(ll,18);
}
map.on('click',e=>{if(!selected)selectProperty(e.latlng,{id:'map-point'})});

function startMeasure(){
 if(drawing){drawing.remove();drawing=null}
 const group=new L.FeatureGroup();map.addLayer(group);
 const dc=new L.Control.Draw({draw:{polygon:true,polyline:false,rectangle:true,circle:false,circlemarker:false,marker:false},edit:{featureGroup:group,remove:true}});
 map.addControl(dc);
 map.once(L.Draw.Event.CREATED,e=>{
   group.addLayer(e.layer); drawing=e.layer; map.removeControl(dc);
   const gj=e.layer.toGeoJSON(); const area=turf.area(gj);
   const sqft=Math.round(area*10.7639); const acres=(area/4046.8564224).toFixed(3);
   document.getElementById('selected').classList.remove('hidden');
   if(!selected)selected={lat:map.getCenter().lat,lng:map.getCenter().lng,buildingId:'measured'};
   document.getElementById('sqft').value=sqft;document.getElementById('acres').value=acres;calcPrice();
   document.getElementById('address').textContent='Measured yard at map location';
 });
}
function fromAcres(){const a=parseFloat(document.getElementById('acres').value);if(a>=0){document.getElementById('sqft').value=Math.round(a*43560);calcPrice()}}
function calcPrice(){
 const s=parseFloat(document.getElementById('sqft').value)||0;
 const price=settings.base+(s/1000)*settings.per1000;
 document.getElementById('price').textContent='$'+Math.max(0,Math.round(price));
}
function saveLead(status){
 if(!selected){alert('Tap a house or map location first.');return}
 const sqft=parseFloat(document.getElementById('sqft').value)||0;
 if(!sqft){alert('Enter or measure the yard size first.');return}
 const price=Math.round(settings.base+(sqft/1000)*settings.per1000);
 const lead={...selected,address:document.getElementById('address').textContent,sqft,acres:(sqft/43560).toFixed(3),price,status,date:new Date().toLocaleString()};
 leads.unshift(lead);localStorage.setItem('jjLeads',JSON.stringify(leads));renderLeads();
 alert(status==='YES'?'Saved as a customer!':'Saved as a no for follow-up tracking.');
}
function renderLeads(){
 document.getElementById('leads').innerHTML=leads.length?leads.map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid #dce7de"><b>${x.status==='YES'?'✅':'❌'} ${x.status}</b> — $${x.price} — ${x.sqft.toLocaleString()} sq ft<br><span class="small">${x.address}<br>${x.date}</span></div>`).join(''):'<div class="small" style="padding-top:8px">No customers saved yet.</div>';
}
function showSettings(){document.getElementById('settings').classList.toggle('hidden')}
function saveSettings(){
 settings={base:parseFloat(document.getElementById('base').value)||0,per1000:parseFloat(document.getElementById('per1000').value)||0};
 localStorage.setItem('jjSettings',JSON.stringify(settings));calcPrice();alert('Pricing saved.');
}
</script>
</body>
</html>
